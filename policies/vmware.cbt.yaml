id: vmware.cbt
version: '1.0'
skill: vmware/cbt
required_evidence:
- capability: observability.search
  parameters:
    domain: vmware
    signal: cbt_state
- capability: observability.search
  parameters:
    domain: vmware
    signal: task_state
- capability: observability.search
  parameters:
    domain: mtv
    signal: transfer_errors
hypotheses:
- id: H-CBT
  mechanism: VMWARE.CBT_STATE
  description: VMware Changed Block Tracking state is implicated in the source transfer failure.
  score: 0.90
  supporting:
    any:
    - CBT_FAILED
    - CBT_QUERY_FAILED
    - CBT_LIMIT_REACHED
  contradicting:
    any:
    - CBT_READY
decision_readiness:
  retry:
    required_facts:
    - CBT_READY
    - VM_ACCESSIBLE
    description: CBT state and source VM accessibility must be re-verified before
      retry.
