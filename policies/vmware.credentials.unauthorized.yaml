id: vmware.credentials.unauthorized
version: '1.0'
skill: vmware/credentials-unauthorized
required_evidence:
- capability: observability.search
  parameters:
    domain: vmware
    signal: auth_errors
- capability: observability.search
  parameters:
    domain: mtv
    signal: migration_state
hypotheses:
- id: H-VMWARE-UNAUTHORIZED
  mechanism: VMWARE.CREDENTIALS.UNAUTHORIZED
  description: VMware provider authentication failed (HTTP 401 Unauthorized).
  score: 0.90
  supporting:
    any:
    - CREDENTIALS_UNAUTHORIZED
    - HTTP_401
  contradicting:
    any:
    - CREDENTIALS_VALIDATED
decision_readiness:
  retry:
    required_facts:
    - CREDENTIALS_VALIDATED
    description: VMware provider secret and credentials must be updated and verified before retry.

