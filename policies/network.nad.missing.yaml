id: network.nad.missing
version: '1.0'
skill: network/nad-missing
required_evidence:
- capability: observability.search
  parameters:
    domain: ocv
    signal: nad_state
- capability: observability.search
  parameters:
    domain: ocv
    signal: network_attachment_state
- capability: observability.search
  parameters:
    domain: ocv
    signal: network_events
hypotheses:
- id: H-NAD
  mechanism: NETWORK.NAD_CONFIGURATION
  description: Required network attachment definition is missing or unavailable.
  score: 0.90
  supporting:
    any:
    - NAD_MISSING
    - NAD_NOT_FOUND
    - NETWORK_ATTACHMENT_FAILED
  contradicting:
    any:
    - NAD_AVAILABLE
decision_readiness:
  retry:
    required_facts:
    - NAD_AVAILABLE
    - NETWORK_MAPPING_VALID
    description: Target network attachment and mapping must be verified before retry.
