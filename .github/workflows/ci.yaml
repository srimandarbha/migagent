name: MFA CI & Production Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Build, Lint, Validate & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies from lockfile
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.lock
          pip install --no-deps -e .
          pip install pytest pytest-cov

      - name: Compile check
        run: |
          python -m compileall engine persistence simulator scripts tests

      - name: Policy validation
        run: |
          python -c "from pathlib import Path; from engine.rules.policy_validator import validate_all_policies; errs = validate_all_policies(Path('policies'), Path('skills')); assert not errs, f'Policy validation errors: {errs}'"

      - name: Source corpus validation
        run: |
          python scripts/validate_source_corpus.py

      - name: Run test suite
        run: |
          pytest -q

  integration:
    name: Live E2E Integration (Kafka KRaft + Postgres pgvector)
    runs-on: ubuntu-latest
    services:
      kafka:
        image: bitnami/kafka:3.7
        ports:
          - 9092:9092
        env:
          KAFKA_CFG_NODE_ID: 0
          KAFKA_CFG_PROCESS_ROLES: controller,broker
          KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@localhost:9093
          KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      postgres:
        image: pgvector/pgvector:pg16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: migration_agent
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies from lockfile
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.lock
          pip install --no-deps -e .
          pip install pytest pytest-cov

      - name: Run live integration & offset discipline tests
        run: |
          KAFKA_BOOTSTRAP_SERVERS=localhost:9092 DATABASE_URL=postgresql://postgres:postgres@localhost:5432/migration_agent RUN_INTEGRATION=1 pytest -q tests/kafka tests/persistence
