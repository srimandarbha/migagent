  - id: RH-SOL-3661131
    applicability:
      mtv: {min: '2.8', max: '2.12'}
      ocv: {versions: ['4.18', '4.19', '4.20', '4.21']}
    source: redhat
    kind: solution
    product: migration-toolkit-for-virtualization
    product_version: "2.11"
    failure_codes:
      - "conversion.virt_v2v.cdrom"
      - "conversion.virt_v2v.ide0_0"
    title: virt-v2v fails with Invalid or not yet handled value for VMX entry ide0:0.fileName for device type cdrom-image
    url: https://access.redhat.com/solutions/3661131
    text: |
      # virt-v2v Fails on VMware VMX CD-ROM Image Entry (ide0:0.fileName)

      ## Symptom and Failure Signature
      During the conversion phase of a VMware virtual machine migration, virt-v2v fails with:
      "virt-v2v: error: exception: libvirt: VIR_ERR_INTERNAL_ERROR: ... Invalid or not yet handled value for VMX entry 'ide0:0.fileName' for device type 'cdrom-image'".

      ## Technical Root Cause Analysis
      virt-v2v uses libvirt to inspect and parse the virtual machine configuration (.vmx file).
      When a VMware virtual machine has a virtual CD/DVD-ROM drive configured to mount an ISO image located on a datastore, or if the VMX file contains stale/unresolved relative paths such as ide0:0.fileName = "auto detect" or points to an ISO that has been deleted or unmounted, libvirt's VMX parser encounters an unsupported device mapping and raises VIR_ERR_INTERNAL_ERROR.

      ## Authoritative Diagnostic Procedure
      1. Inspect the source virtual machine hardware configuration in VMware vCenter.
      2. Check whether CD/DVD Drive 1 (IDE 0:0) is attached to a "Datastore ISO file".
      3. Verify the .vmx configuration file for lines beginning with ide0:0 or ide0:1.

      ## Recommended Recovery Procedure
      1. In VMware vSphere Client, edit the virtual machine settings.
      2. Under CD/DVD drive 1, change the device type from "Datastore ISO file" to "Client Device" or disconnect the drive ("Connect at power on" = unchecked).
      3. Alternatively, remove the virtual CD-ROM drive completely from the VM before initiating the migration.
      4. Restart the MTV Migration Plan.
    tags: [conversion, virt-v2v, cdrom, ide0:0, libvirt, vmx, iso]

  - id: RH-SOL-VMDK-URL-NOT-FOUND
    applicability:
      mtv: {min: '2.8', max: '2.12'}
      ocv: {versions: ['4.18', '4.19', '4.20', '4.21']}
    source: redhat
    kind: solution
    product: migration-toolkit-for-virtualization
    product_version: "2.11"
    failure_codes:
      - "conversion.vmdk.url_not_found"
      - "vmware.vmdk.not_found"
    title: virt-v2v fails with vcenter URL not found for flat.vmdk disk image
    url: https://access.redhat.com/solutions/7150110
    text: |
      # virt-v2v Fails with vCenter URL Not Found for flat.vmdk

      ## Symptom and Failure Signature
      virt-v2v fails during disk streaming or conversion with:
      "virt-v2v: error: vcenter: URL not found: https://vcenter.corp/folder/vm/vm-flat.vmdk?dcPath=Datacenter&dsName=datastore1".

      ## Technical Root Cause Analysis
      virt-v2v constructs HTTPS URLs to download the VMDK disk descriptor and underlying raw -flat.vmdk data file directly from the vCenter inventory datastore web service.
      Common root causes include:
      1. Storage vMotion or datastore migration relocated the virtual machine files while the migration plan was in progress.
      2. The VMDK was registered with an absolute path or snapshot descriptor that no longer exists on the specified datastore.
      3. Datastore name contains special characters or spaces that are incorrectly escaped in the URL path.
      4. The VM was deleted or unregistered from the inventory.

      ## Authoritative Diagnostic Procedure
      1. Verify that the VMDK files (*.vmdk, *-flat.vmdk) exist on the datastore using the vSphere Datastore Browser or govc datastore.ls.
      2. Inspect the VM configuration in vCenter to confirm the datastore path and backing VMDK file name.
      3. Verify whether DRS or Storage DRS moved the VM during migration.

      ## Recommended Recovery Procedure
      1. Ensure Storage DRS is disabled for virtual machines undergoing active migration.
      2. If the VMDK was moved, refresh the MTV Provider inventory in the OpenShift web console and update the Migration Plan.
      3. Re-run the migration plan.
    tags: [conversion, virt-v2v, vcenter, vmdk, flat-vmdk, url-not-found, 404]

  - id: RH-SOL-LIBVIRT-ESX-401
    applicability:
      mtv: {min: '2.8', max: '2.12'}
      ocv: {versions: ['4.18', '4.19', '4.20', '4.21']}
    source: redhat
    kind: solution
    product: migration-toolkit-for-virtualization
    product_version: "2.11"
    failure_codes:
      - "conversion.esx.unauthorized"
      - "vmware.credentials.unauthorized"
    title: virt-v2v fails with libvirt VIR_FROM_ESX HTTP response code 401 Unauthorized
    url: https://access.redhat.com/solutions/7150111
    text: |
      # virt-v2v Fails with libvirt VIR_FROM_ESX HTTP Response Code 401 Unauthorized

      ## Symptom and Failure Signature
      virt-v2v conversion pod fails with:
      "virt-v2v: error: exception: libvirt: VIR_ERR_INTERNAL_ERROR: VIR_FROM_ESX ... HTTP response code 401".

      ## Technical Root Cause Analysis
      virt-v2v connects to VMware ESXi or vCenter using libvirt's ESX driver over HTTPS.
      An HTTP response code 401 (Unauthorized) indicates that the credentials provided by the MTV Provider secret were rejected by the VMware hypervisor or vCenter Server.
      Common causes:
      1. VMware vCenter service account password expired or was rotated after the MTV Provider was created.
      2. The user account is locked out in Active Directory or VMware SSO due to excessive failed login attempts.
      3. Special characters in the password (e.g., quotes, semicolons, ampersands) were unescaped in the Provider Secret YAML.

      ## Authoritative Diagnostic Procedure
      1. Test authentication directly from an OpenShift pod using curl -u "user:password" -k https://<vcenter-host>/sdk.
      2. Check VMware vCenter Single Sign-On (SSO) event logs for failed logon attempts and account lockouts.
      3. Inspect the MTV Provider secret in openshift-mtv namespace.

      ## Recommended Recovery Procedure
      1. Verify and update the MTV Provider Secret with valid VMware credentials.
      2. If using Active Directory / LDAP authentication, ensure the account is unlocked and password expiration is set to never expire for service accounts.
      3. Revalidate the MTV Provider in the OpenShift console and restart the migration plan.
    tags: [conversion, virt-v2v, esx, 401, unauthorized, libvirt, credentials]
