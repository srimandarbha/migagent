notes:
- Verified means the failure condition or migration constraint is explicitly grounded
  in the cited Red Hat documentation/release notes; it does not mean the exact synthetic
  log string is copied from Red Hat.
- Customer Portal solution content must not be invented. Public documentation is used
  as the authoritative corpus anchor.
- Historical/fixed issues are valid diagnostic scenarios because the agent must recognize
  known signatures and version applicability.
- Each scenario needs deterministic evidence contracts, policy/skill, fixtures and
  expected-output assertions before its matrix rows can become executable PASS tests.
