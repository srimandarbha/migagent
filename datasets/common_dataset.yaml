  title: Requirements and remediation for CBT disabled on source VMware VM and virtual
    disks
  url: https://docs.redhat.com/en/documentation/migration_toolkit_for_virtualization/2.11/html/planning_your_migration_to_red_hat_openshift_virtualization/cbt_disabled_prerequisites
  text: '# VMware Changed Block Tracking Prerequisites: CBT Disabled on VM or Disk


    ## Symptom and Failure Signature

    MTV preflight validation fails immediately with error vmware.cbt.disabled or vmware.cbt.disk_disabled.
    The MTV user interface displays "Warm migration requires Changed Block Tracking
    to be enabled on the source virtual machine and all attached disks".


    ## Technical Root Cause Analysis

    Changed Block Tracking (CBT) is an ESXi feature that tracks disk sectors modified
    since the last snapshot. MTV warm migration requires CBT enabled on the VM (ctkEnabled=true)
    and on every SCSI virtual disk attached to the VM (scsiX:Y.ctkEnabled=true).

    Common root causes:

    1. Virtual machine hardware version is lower than version 7 (CBT is unsupported
    on hardware version 6 or lower).

    2. The VM was created without CBT enabled by backup tools.

    3. Newly attached disks lack the scsiX:Y.ctkEnabled setting in the .vmx file.

    4. Raw Device Mappings (RDM) in physical compatibility mode are attached (CBT
    does not support physical RDMs).


    ## Authoritative Diagnostic Procedure

    1. Check VM hardware version using vCenter API or govc.

    2. Inspect VM extraConfig parameters for ctkEnabled and disk-specific ctkEnabled
    entries.

    3. Verify that all attached virtual disks are standard VMDK virtual disks or virtual
    compatibility mode RDMs.


    ## Recommended Recovery Procedure

    1. Enable CBT on the source VM using PowerCLI or vCenter API. Note that taking
    and deleting a snapshot or power-cycling the VM is required for ESXi to activate
    CBT tracking files (*-ctk.vmdk).

    2. If hardware version is outdated, schedule downtime to upgrade the VM hardware
    version.

    '
  tags:
  - mtv
  - vmware
  - cbt
  - prerequisites
  - ctk
  - hardware-version
  - preflight
