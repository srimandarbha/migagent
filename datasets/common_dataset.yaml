  title: OVN secondary transfer network importer pod startup failure
  url: https://access.redhat.com/solutions/7094959
  text: '# OVN Secondary Transfer Network Importer Pod Startup Failure


    ## Symptom and Failure Signature

    CDI importer pod fails to start with network.ovn_transfer_nad. Importer pod displays
    ContainerCreating or Init:CrashLoopBackOff with event: "Multus: [namespace/pod]:
    error adding container to network ''migration-transfer-nad'': failed to configure
    OVN interface".


    ## Technical Root Cause Analysis

    MTV allows designating an isolated high-throughput secondary network as the migration
    transfer network.

    When an OVN-Kubernetes secondary network is used, the OVN controller on the worker
    node configures an OVS port and IPAM address.

    If the OVN secondary network subnet IP pool is exhausted, or if the worker node
    lacks the required physical network attachment, Multus fails to attach the container
    interface.


    ## Authoritative Diagnostic Procedure

    1. Inspect Multus events on the importer pod: oc describe pod <importer-pod> -n
    <target-ns>.

    2. Check OVN secondary network IPAM status and subnet allocations.

    3. Verify that the NodeNetworkConfigurationPolicy (NNCP) has configured the physical
    uplink interface on all target worker nodes.


    ## Recommended Recovery Procedure

    1. Expand the OVN secondary network subnet IP range if exhausted.

    2. Ensure all OpenShift worker nodes in the target migration pool have applied
    the secondary network policy.

    '
  tags:
  - network
  - ovn
  - transfer-network
  - multus
  - cdi
  - ipam
