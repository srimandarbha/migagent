  - vmware.vcenter.tls_thumbprint_mismatch
  - vmware.esxi.port443_unreachable
  title: VMware vCenter HTTPS port 443 connection failure and TLS certificate thumbprint
    mismatch
  url: https://access.redhat.com/solutions/7150102
  text: '# VMware vCenter Port 443 Unreachable or TLS Thumbprint Mismatch


    ## Symptom and Failure Signature

    MTV Provider validation fails with vmware.vcenter.port443_unreachable or vmware.vcenter.tls_thumbprint_mismatch.
    The Provider status Condition displays "Provider validation failed: x509: certificate
    signed by unknown authority" or "TLS thumbprint mismatch".


    ## Technical Root Cause Analysis

    MTV connects to VMware vCenter Server over HTTPS port 443 for inventory discovery,
    VM metadata synchronization, and snapshot lifecycle commands.

    Failures occur when:

    1. vCenter SSL certificate was renewed or replaced, causing the SHA-1 or SHA-256
    thumbprint in the MTV Provider Secret to become stale.

    2. Corporate egress proxies or firewalls intercept TLS traffic, returning an unexpected
    certificate chain.

    3. Network firewall rules block TCP port 443 between OpenShift control plane/worker
    nodes and vCenter.


    ## Authoritative Diagnostic Procedure

    1. Retrieve the live vCenter certificate thumbprint using openssl s_client -connect
    <vcenter-fqdn>:443 < /dev/null 2>/dev/null | openssl x509 -fingerprint -sha256
    -noout.

    2. Inspect the MTV Provider secret in the openshift-mtv namespace for the thumbprint
    or ca.crt field.

    3. Verify HTTP/HTTPS connectivity from the MTV controller pod.


    ## Recommended Recovery Procedure

    1. Update the MTV Provider Secret with the correct current SHA-256 certificate
    thumbprint or import the enterprise root CA into the cluster trust store.

    2. Verify that network routing and firewall rules permit port 443 HTTPS traffic
    to vCenter.

    '
  tags:
  - mtv
  - vmware
  - vcenter
  - tls
  - thumbprint
  - port-443
  - certificate
