  title: Windows NTFS dirty bit and read-only mount during virt-v2v inspection
  url: https://access.redhat.com/solutions/7142019
  text: '# Windows NTFS Filesystem Dirty Bit Preventing virt-v2v Conversion


    ## Symptom and Failure Signature

    virt-v2v conversion of a Windows guest fails with os.windows.filesystem_readonly
    or os.windows.ntfs_dirty_bit. Conversion pod logs report: "NTFS volume is dirty;
    metadata state is unclean. Refusing to mount read-write: Operation not permitted".


    ## Technical Root Cause Analysis

    virt-v2v must mount the Windows NTFS system volume read-write using ntfs-3g to
    inject Red Hat VirtIO storage and network drivers into the Windows DriverStore
    and update the SYSTEM registry hive.

    If Windows Fast Startup is enabled (hiberfil.sys contains cached kernel state)
    or if the VM was powered off abruptly, the NTFS volume is flagged dirty. ntfs-3g
    refuses read-write mounts on dirty volumes to prevent filesystem corruption.


    ## Authoritative Diagnostic Procedure

    1. Check Windows power configuration on source VM for "Turn on fast startup (recommended)".

    2. Check if the VM was cleanly shut down or forced off via power cut.

    3. Verify ntfs-3g error messages in the virt-v2v conversion pod log.


    ## Recommended Recovery Procedure

    1. Boot the Windows VM in vSphere, open an administrative command prompt, and
    run: powercfg /h off to disable hibernation and Fast Startup.

    2. Run chkdsk C: /f to ensure NTFS metadata is clean, then execute a clean shutdown:
    shutdown /s /t 0.

    3. Restart the migration plan.

    '
  tags:
  - conversion
  - windows
  - ntfs
  - fast-startup
  - virt-v2v
  - drivers
