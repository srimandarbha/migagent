  title: OpenShift DNS resolution failure for VMware ESXi hostnames
  url: https://access.redhat.com/solutions/7099933
  text: '# VMware ESXi Hostname DNS Resolution Failure in OpenShift


    ## Symptom and Failure Signature

    MTV disk transfer fails with vmware.esxi.dns_resolution. Importer pod logs contain:
    "VDDK [ERROR] Cannot resolve host: esx-node04.corp.internal: Name or service not
    known".


    ## Technical Root Cause Analysis

    When MTV connects to vCenter, vCenter provides the FQDN or hostname of the specific
    ESXi hypervisor hosting the VMDK disks.

    The VDDK library inside the CDI importer pod attempts to resolve this ESXi hostname
    using OpenShift CoreDNS.

    If the ESXi hostnames are registered only in a private VMware management DNS zone
    that is not forwarded by OpenShift CoreDNS, DNS resolution fails, aborting the
    NFC connection.


    ## Authoritative Diagnostic Procedure

    1. Query CoreDNS configuration in OpenShift: oc get dns.operator/default -o yaml.

    2. Test DNS resolution of the ESXi hostname from within a debug pod on the worker
    node: dig +short <esxi-hostname>.

    3. Verify whether vCenter inventory lists ESXi hosts by IP address or FQDN.


    ## Recommended Recovery Procedure

    1. Add a conditional forwarding rule to OpenShift CoreDNS (dns.operator.openshift.io/default)
    directing the VMware internal domain to the VMware management DNS servers.

    2. Alternatively, configure ESXi hosts in vCenter with resolvable FQDNs or configure
    CoreDNS upstream servers.

    '
  tags:
  - mtv
  - vmware
  - esxi
  - dns
  - coredns
  - vddk
  - resolution
