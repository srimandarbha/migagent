  title: Ceph RBD exclusive volume lock conflict on OpenShift Data Foundation
  url: https://access.redhat.com/solutions/7150104
  text: '# OpenShift Data Foundation Ceph RBD Volume Exclusive Lock Conflict


    ## Symptom and Failure Signature

    CDI importer pod fails to mount target volume with storage.csi.rbd_lock_conflict.
    Node kernel log and CSI logs show: "rbd: image is locked by other client; failed
    to acquire exclusive lock".


    ## Technical Root Cause Analysis

    OpenShift Data Foundation (ODF) Block pools use Ceph RADOS Block Device (RBD)
    images with exclusive-lock feature enabled.

    If a previous migration attempt, importer pod, or worker node crashed unexpectedly,
    the Ceph client watcher may retain an active lock lease on the RBD image until
    timeout expires (typically 30 seconds to several minutes).


    ## Authoritative Diagnostic Procedure

    1. Inspect VolumeAttachment objects: oc get volumeattachment.

    2. Check Ceph RBD image status in the rook-ceph operator toolbox: rbd status <pool>/<image-name>.

    3. Identify client IP holding the stale lock.


    ## Recommended Recovery Procedure

    1. Verify that the previous pod referencing the PVC is completely terminated (oc
    get pods -n <target-ns>).

    2. If stale lock persists after pod termination, remove stale lock using Ceph
    toolbox: rbd lock rm <pool>/<image-name> <lock-id> <client>.

    '
  tags:
  - storage
  - odf
  - ceph
  - rbd
  - lock
  - csi
