  title: SUSE Linux Enterprise Server SLES guest OS inspection failure
  url: https://access.redhat.com/solutions/7107288
  text: '# SLES Guest Operating System Inspection Failure


    ## Symptom and Failure Signature

    virt-v2v inspection aborts with os.sles.inspection_failed or os.unknown_distribution.
    Controller logs show: "virt-v2v: error: inspection could not determine the source
    guest OS".


    ## Technical Root Cause Analysis

    virt-v2v inspects /etc/os-release and kernel rpm packages to detect the operating
    system distribution.

    For SUSE Linux Enterprise Server (SLES) 12 and 15, default installations use Btrfs
    with nested subvolumes (@, @/boot, @/var).

    If the default Btrfs subvolume is not set correctly or if custom kernel packages
    without standard RPM metadata are installed, libguestfs fails to mount the root
    filesystem.


    ## Authoritative Diagnostic Procedure

    1. Inspect source SLES VM filesystem hierarchy and Btrfs subvolumes: btrfs subvolume
    get-default /.

    2. Verify /etc/os-release contains standard NAME="SLES" and VERSION_ID fields.


    ## Recommended Recovery Procedure

    1. Ensure the Btrfs root subvolume is properly designated as the default subvolume.

    2. Verify standard SLES enterprise kernel packages are active before migration.

    '
  tags:
  - conversion
  - sles
  - suse
  - btrfs
  - inspection
  - virt-v2v
