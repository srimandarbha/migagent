  title: CDI importer pod failure due to OpenShift namespace ResourceQuota exceeded
  url: https://access.redhat.com/solutions/7150103
  text: '# OpenShift Storage ResourceQuota Exceeded During Migration


    ## Symptom and Failure Signature

    DataVolume creation or CDI importer pod creation fails with storage.quota_exceeded
    or storage.datavolume_clone_failed. Event displays: "failed quota: compute-quota:
    must specify limits.cpu,limits.memory" or "exceeded quota: requests.storage".


    ## Technical Root Cause Analysis

    OpenShift namespaces frequently enforce ResourceQuotas on storage capacity (requests.storage,
    persistentvolumeclaims) or compute resources (requests.cpu, requests.memory).

    When migrating large multi-disk VMs, the aggregate storage requested by CDI DataVolumes
    can exceed the namespace quota ceiling, preventing Kubernetes from creating PVCs
    or spawning importer pods.


    ## Authoritative Diagnostic Procedure

    1. Check namespace ResourceQuotas: oc get resourcequota -n <target-namespace>.

    2. Inspect quota usage: oc describe resourcequota -n <target-namespace>.

    3. Review rejected PVC/pod events for quota restriction messages.


    ## Recommended Recovery Procedure

    1. Request OpenShift cluster administrator to temporarily increase requests.storage
    quota in the target namespace.

    2. Migrate VMs in smaller waves to stay within allocated namespace storage bounds.

    '
