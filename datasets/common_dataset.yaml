splunk:
  # Simulated normalized observations from OCV, MTV, VMware and storage domains.
  - id: spl-001
    domain: ocv
    signal: pvc_state
    cluster_id: ocv-prod-a
    vm_id: vm-web-101
    fact_code: PVC_PENDING
  - id: spl-002
    domain: ocv
    signal: csi_errors
    cluster_id: ocv-prod-a
    vm_id: vm-web-101
    fact_code: CSI_PROVISIONING_TIMEOUT
  - id: spl-003
    domain: storage
    signal: backend_health
    cluster_id: ocv-prod-a
    vm_id: vm-web-101
    fact_code: BACKEND_HEALTHY
  - id: spl-004
    domain: mtv
    signal: migration_state
    cluster_id: ocv-prod-a
    vm_id: vm-web-101
    fact_code: MIGRATION_FAILED
  - id: spl-local-001
    domain: ocv
    signal: pvc_state
    cluster_id: ocv-prod-01
    vm_id: vm-456
    fact_code: PVC_PENDING
    observed_at: '2026-09-30T17:59:52Z'
  - id: spl-local-002
    domain: ocv
    signal: csi_errors
    cluster_id: ocv-prod-01
    vm_id: vm-456
    fact_code: CSI_PROVISIONING_TIMEOUT
    observed_at: '2026-09-30T17:59:55Z'
  - id: spl-local-003
    domain: storage
    signal: backend_health
    cluster_id: ocv-prod-01
    vm_id: vm-456
    fact_code: BACKEND_HEALTHY
    observed_at: '2026-09-30T17:59:50Z'
  - id: spl-local-004
    domain: mtv
    signal: migration_state
    cluster_id: ocv-prod-01
    vm_id: vm-456
    fact_code: MIGRATION_FAILED
    observed_at: '2026-09-30T18:00:00Z'
  - id: spl-local-005
    domain: ocv
    signal: csi_controller_errors
    cluster_id: ocv-prod-01
    vm_id: vm-456
    fact_code: CSI_CONTROLLER_PROVISIONING_ERROR
    observed_at: '2026-09-30T17:59:56Z'
  - id: spl-local-006
    domain: ocv
    signal: pvc_events
    cluster_id: ocv-prod-01
    vm_id: vm-456
    fact_code: PVC_PROVISIONING_FAILED
    observed_at: '2026-09-30T17:59:57Z'
  - id: spl-005
    domain: network
    signal: nad_state
    cluster_id: ocv-prod-a
    vm_id: vm-db-204
    fact_code: NAD_MISSING
  - id: spl-006
    domain: vmware
    signal: cbt_state
    cluster_id: ocv-prod-b
    vm_id: vm-app-305
    fact_code: CBT_FAILED

  # Kafka/local integration fixture. These records are wildcard observations keyed by
  # the incoming failure_code. They are synthetic_test_record data, not customer history.
  - id: kafka-storage-csi-pvc
    event_failure_code: storage.csi.provisioning_timeout
    domain: ocv
    signal: pvc_state
    fact_code: PVC_PENDING
    metadata: {synthetic_test_record: true}
  - id: kafka-storage-csi-error
    event_failure_code: storage.csi.provisioning_timeout
    domain: ocv
    signal: csi_errors
    fact_code: CSI_PROVISIONING_TIMEOUT
    metadata: {synthetic_test_record: true}
  - id: kafka-storage-backend-healthy
    event_failure_code: storage.csi.provisioning_timeout
    domain: storage
    signal: backend_health
    fact_code: BACKEND_HEALTHY
    metadata: {synthetic_test_record: true}
  - id: kafka-storage-migration-failed
    event_failure_code: storage.csi.provisioning_timeout
    domain: mtv
    signal: migration_state
    fact_code: MIGRATION_FAILED
    metadata: {synthetic_test_record: true}
  - id: kafka-storage-csi-controller-error
    event_failure_code: storage.csi.provisioning_timeout
    domain: ocv
    signal: csi_controller_errors
    fact_code: CSI_CONTROLLER_PROVISIONING_ERROR
    metadata: {synthetic_test_record: true}
  - id: kafka-storage-pvc-event
    event_failure_code: storage.csi.provisioning_timeout
    domain: ocv
    signal: pvc_events
    fact_code: PVC_PROVISIONING_FAILED
    metadata: {synthetic_test_record: true}

