# Shared local test dataset. Adapters read the same records and expose different capability contracts.
# hidden_truth is intentionally absent from this dataset.
redhat_knowledge:
  - id: RH-DOC-MTV-TROUBLESHOOTING-2.11
    source: redhat
    kind: documentation
    product: migration-toolkit-for-virtualization
    title: Migration Toolkit for Virtualization 2.11 troubleshooting migration
    url: https://docs.redhat.com/en/documentation/migration_toolkit_for_virtualization/2.11/html/migrating_your_virtual_machines_to_red_hat_openshift_virtualization/assembly_troubleshooting-migration_mtv
    text: >-
      Red Hat troubleshooting guidance covers destination network not found, warm migration
      CBT snapshot failures, and migration workflow investigation across Migration Controller,
      CDI, DataVolume, PVC, importer and conversion stages.
    tags: [mtv, troubleshooting, migration, cbt, pvc, datavolume, network]
  - id: RH-DOC-OV-ARCH-7119411
    source: redhat
    kind: documentation
    product: openshift-virtualization
    title: OpenShift Virtualization Architecture Guide
    url: https://access.redhat.com/articles/7119411
    text: >-
      Architectural guidance for OpenShift Virtualization workloads, including target
      platform considerations for VMware vSphere migrations.
    tags: [architecture, ocv, vmware, migration]
  - id: RH-PORTAL-OV
    source: redhat
    kind: product
    product: openshift-virtualization
    title: Red Hat OpenShift Virtualization product resources
    url: https://access.redhat.com/products/red-hat-openshift-virtualization/
    text: >-
      Product documentation, release notes, sizing, architecture, migration and
      security advisory resources for OpenShift Virtualization.
    tags: [ocv, documentation, migration, security]
  - id: RH-SOL-7147627
    source: redhat
    kind: solution
    product: openshift-virtualization
    title: Is OpenShift Virtualization affected by CVE-2026-64561?
    url: https://access.redhat.com/solutions/7147627
    text: >-
      Verified Red Hat solution describing affected environments, prerequisites,
      mitigation considerations and product-specific applicability for OCP/OCV.
    tags: [cve, ocv, mitigation, solution]
  - id: RH-CVE-2026-13218
    source: redhat
    kind: cve
    product: openshift-virtualization
    title: CVE-2026-13218
    url: https://access.redhat.com/security/cve/cve-2026-13218
    text: >-
      KubeVirt virt-handler network cache symlink-following vulnerability. Red Hat
      documents applicability, mitigation and affected OpenShift Virtualization components.
    tags: [cve, kubevirt, virt-handler, network, security]
  - id: RH-CVE-2026-34742
    source: redhat
    kind: cve
    product: migration-toolkit-for-virtualization
    title: CVE-2026-34742 affected-product listing
    url: https://access.redhat.com/security/cve/cve-2026-34742
    text: >-
      Red Hat CVE record with affected-product and errata status information; MTV
      components are explicitly represented in the affected-products table.
    tags: [cve, mtv, security, errata]
  - id: RH-CVE-2026-66010
    source: redhat
    kind: cve
    product: migration-toolkit-for-virtualization
    title: CVE-2026-66010 affected-product listing
    url: https://access.redhat.com/security/cve/cve-2026-66010
    text: >-
      Red Hat CVE record containing MTV console-plugin affected-product state and
      fix-deferred information.
    tags: [cve, mtv, security, errata]
  - id: RH-CVE-2026-17527
    source: redhat
    kind: errata
    product: openshift-virtualization
    title: CVE-2026-17527 OpenShift Virtualization errata mapping
    url: https://access.redhat.com/security/cve/cve-2026-17527
    text: >-
      Red Hat security record showing OpenShift Virtualization component affected
      states and released fixes across product versions.
    tags: [errata, ocv, cve, security]
  - id: RH-CVE-2025-64433
    source: redhat
    kind: cve
    product: openshift-virtualization
    title: CVE-2025-64433 affected OpenShift Virtualization components
    url: https://access.redhat.com/security/cve/cve-2025-64433
    text: >-
      Red Hat CVE record listing multiple OpenShift Virtualization components and
      their remediation status.
    tags: [cve, ocv, security]

