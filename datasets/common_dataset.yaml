  title: HostPath and local storage volume node affinity scheduling conflict
  url: https://access.redhat.com/solutions/7095814
  text: '# HostPath and Local Storage Volume Node Affinity Conflict


    ## Symptom and Failure Signature

    Migration fails during transfer or VM creation with storage.hostpath.node_affinity.
    Importer or virt-launcher pods remain Unschedulable with event: "0/12 nodes are
    available: 1 node(s) had volume node affinity conflict, 11 node(s) didn''t match
    Pod''s node affinity/selector".


    ## Technical Root Cause Analysis

    Local PersistentVolumes (such as hostpath-provisioner or Local Storage Operator
    LSO) bind volumes to a specific physical OpenShift node using nodeAffinity.

    If the PVC is provisioned on Node A, but subsequent importer pods or KubeVirt
    VM launcher pods are constrained to Node B (due to MTV target node placement rules,
    lack of CPU/RAM, or node cordoning), Kubernetes scheduler cannot schedule the
    pod.


    ## Authoritative Diagnostic Procedure

    1. Inspect PV node affinity: oc get pv <pv-name> -o yaml | grep -A 10 nodeAffinity.

    2. Check target node schedulability: oc get nodes -l node-role.kubernetes.io/worker.

    3. Inspect pod scheduling failure events: oc describe pod <pod-name> -n <namespace>.


    ## Recommended Recovery Procedure

    1. Uncordon target node if cordoned, or free memory/CPU capacity on the node holding
    the local volume.

    2. Red Hat recommends shared storage (Ceph RBD / ODF / SAN) for OpenShift Virtualization
    workloads to allow VM live migration and flexible pod scheduling.

    '
  tags:
  - storage
  - hostpath
  - node-affinity
  - local-storage
  - scheduling
