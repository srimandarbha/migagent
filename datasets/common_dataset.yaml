  failure_codes:
  - vmware.snapshot.consolidation_failed
  - vmware.snapshot.locked_vmdk
  title: VMware virtual machine snapshot consolidation failure and locked VMDK descriptors
  url: https://access.redhat.com/solutions/7150101
  text: '# Resolving VMware Snapshot Consolidation Failure and Locked VMDKs


    ## Symptom and Failure Signature

    Migration fails during precopy or disk transfer with vmware.snapshot.consolidation_failed
    or vmware.snapshot.locked_vmdk. VMware vCenter generates alert "Virtual machine
    disks consolidation needed", and MTV cannot acquire an exclusive lock on the VMDK
    delta chain.


    ## Technical Root Cause Analysis

    During warm migration, MTV requests incremental snapshots. If backup agents or
    previous migration pods terminate abnormally without releasing VMDK file locks,
    ESXi hostd or vpxa retains file descriptor locks on delta files (*-00000X.vmdk).

    When MTV attempts to clean up or create subsequent snapshots, vSphere returns
    generic file lock or snapshot consolidation errors.


    ## Authoritative Diagnostic Procedure

    1. Check vCenter VM summary for "Configuration Issues: Virtual machine disks consolidation
    needed".

    2. Execute vSphere API / govc to query VirtualMachine.runtime.consolidationNeeded.

    3. On ESXi shell, use vmkfstools -D on the base VMDK to discover the MAC address
    of the ESXi host holding the file lock.


    ## Recommended Recovery Procedure

    1. In vCenter, right-click the virtual machine -> Snapshots -> Consolidate Disks.

    2. If consolidation fails with locked files, restart ESXi management agents (services.sh
    restart) on the host hosting the VM.

    3. Ensure third-party backup software is paused for the VM during the migration
    maintenance window.

    '
  tags:
  - vmware
  - snapshot
  - consolidation
  - vmdk
  - file-lock
  - esxi
- id: RH-SOL-ESXI-PORT902-CONNECTIVITY
  applicability:
    mtv:
      min: '2.8'
      max: '2.12'
    ocv:
      versions:
      - '4.19'
      - '4.20'
      - '4.21'
  source: redhat
  kind: solution
  product: migration-toolkit-for-virtualization
  product_version: '2.11'
  failure_codes:
  - vmware.esxi.port902_timeout
  - network.esxi.port902_unreachable
  title: VMware ESXi host port 902 network connectivity timeout and NFC connection
    failures
  url: https://access.redhat.com/solutions/7051829
  text: '# ESXi Port 902 Connectivity Timeout During VDDK Transfer


    ## Symptom and Failure Signature

    Migration fails during the disk transfer phase with failure code vmware.esxi.port902_timeout
    or network.esxi.port902_unreachable. The CDI importer pod log contains: "Failed
    to connect to NFC service on host esx-host.corp:902: Connection timed out" or
    "Nbdcopy failed with Connection timed out".


    ## Technical Root Cause Analysis

    MTV orchestrates control plane operations through vCenter on TCP port 443, but
    actual VMDK disk block streaming uses the VMware Network File Copy (NFC) protocol
    via VDDK.

    NFC communicates directly between the OpenShift worker node running the CDI importer
    pod and the ESXi hypervisor hosting the VM on TCP port 902.

    If a firewall, security group, or network routing policy blocks TCP port 902 from
    OpenShift worker nodes to ESXi management interfaces, vCenter discovery succeeds
    but disk transfer fails immediately on port 902.


    ## Authoritative Diagnostic Procedure

    1. Identify the ESXi host currently running the source VM from vCenter inventory.

    2. From the OpenShift worker node hosting the importer pod, test TCP port 902
    reachability using nc -zv <esxi-ip> 902 or curl -v telnet://<esxi-ip>:902.

    3. Verify firewall policies and network security groups between OpenShift SDN/OVN
    subnets and ESXi management VLAN.


    ## Recommended Recovery Procedure

    1. Open bidirectional firewall rules allowing TCP port 902 between OpenShift cluster
    nodes and VMware ESXi management IP addresses.

    2. If routing across firewalls is restricted, configure a dedicated MTV transfer
    network with direct Layer 2/3 adjacency to the ESXi management network.

    '
  tags:
  - mtv
  - vmware
  - esxi
  - nfc
  - port-902
  - connectivity
  - firewall
- id: RH-SOL-VCENTER-PORT443-TLS
  applicability:
