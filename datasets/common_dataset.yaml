  title: Network MTU mismatch causing packet drop and stalled migration disk transfer
  url: https://access.redhat.com/solutions/7150105
  text: '# MTU Mismatch Causing Stalled Disk Transfer and Packet Drops


    ## Symptom and Failure Signature

    Disk transfer starts normally, reaches between 1% and 10%, and then stalls indefinitely
    before failing with network.mtu_mismatch or timeout. Ping tests with small packet
    sizes succeed, but large TCP streams stall.


    ## Technical Root Cause Analysis

    VMware ESXi hosts typically configure MTU 9000 (Jumbo Frames) on vmkernel ports
    dedicated to storage and migration traffic.

    If OpenShift worker nodes or intermediate physical network switches are configured
    with standard MTU 1500, IP fragmentation or black-hole drops occur on large TCP
    segments exceeding 1500 bytes.

    VDDK NFC transfers send maximum segment size blocks, triggering silent packet
    discards when the Don''t Fragment (DF) bit is set.


    ## Authoritative Diagnostic Procedure

    1. Test path MTU from OpenShift worker node to ESXi host with ping -M do -s 8972
    <esxi-ip>.

    2. Inspect switch port drop counters for oversize packets or framing errors.

    3. Verify MTU configuration on OpenShift NodeNetworkConfigurationPolicy (NNCP).


    ## Recommended Recovery Procedure

    1. Align MTU values across the entire path: configure MTU 9000 on OpenShift secondary
    network interfaces or configure MTU 1500 end-to-end.

    2. Verify physical network switch MTU settings.

    '
  tags:
  - network
  - mtu
  - jumbo-frames
  - transfer
  - packet-drop
