  title: RHEL EFI GRUB boot configuration update failure during virt-v2v conversion
  url: https://access.redhat.com/solutions/7107359
  text: '# RHEL Guest EFI GRUB Configuration Update Failure


    ## Symptom and Failure Signature

    virt-v2v conversion fails with os.rhel.grub_configuration. Conversion log reports:
    "virt-v2v: error: cannot update EFI GRUB configuration: /boot/efi/EFI/redhat/grub.cfg:
    No such file or directory".


    ## Technical Root Cause Analysis

    During guest OS conversion, virt-v2v updates the bootloader to load VirtIO SCSI
    and net drivers in early userspace.

    On RHEL 8 and RHEL 9 systems using UEFI, Red Hat switched to the Boot Loader Specification
    (BLS) where grub.cfg is located at /boot/grub2/grub.cfg while /boot/efi/EFI/redhat/grub.cfg
    is a stub forwarding file.

    If the customer manually modified the GRUB configuration, removed the stub, or
    mounted /boot/efi incorrectly, virt-v2v fails to write bootloader configuration.


    ## Authoritative Diagnostic Procedure

    1. Inspect the guest OS filesystem layout using guestfish or a live rescue ISO.

    2. Verify /boot/efi mount point in /etc/fstab.

    3. Check whether grub2-mkconfig or BLS entries in /boot/loader/entries are intact.


    ## Recommended Recovery Procedure

    1. Boot the source VM in VMware, recreate the EFI GRUB stub using grub2-mkconfig
    -o /boot/efi/EFI/redhat/grub.cfg.

    2. Re-run migration.

    '
  tags:
  - conversion
  - rhel
  - grub
  - efi
  - bootloader
  - virt-v2v
