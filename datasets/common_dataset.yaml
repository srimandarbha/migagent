  title: Migration Toolkit for Virtualization 2.12 VMware connectivity ports
  url: https://docs.redhat.com/en/documentation/migration_toolkit_for_virtualization/2.12/html/planning_your_migration_to_red_hat_openshift_virtualization/
  text: '# Migration Toolkit for Virtualization 2.12: Planning Network Connectivity


    ## Section 1: VMware vCenter and ESXi Port Requirements

    Migration Toolkit for Virtualization 2.12 requires specific firewall ports open
    between the OpenShift Virtualization cluster and the source VMware environment:

    - TCP Port 443: HTTPS communication between OpenShift nodes and VMware vCenter
    Server for VM discovery, inventory querying, snapshot management, and API control.

    - TCP Port 902: Direct communication between OpenShift worker nodes running CDI
    importer pods and source VMware ESXi hosts for VDDK disk block transfer.

    - TCP Port 8443: MTV Migration Controller API endpoints.


    ## Section 2: Network Latency, Bandwidth, and Jumbo Frames

    Warm and cold migrations transfer large VMDK disk images across the network. For
    warm migration with Changed Block Tracking (CBT), network throughput directly
    influences snapshot consolidation window length. Low bandwidth or high packet
    loss can cause CBT delta transfers to lag behind VM change rate, leading to retry
    limit exhaustion.

    '
  tags:
  - mtv
  - vmware
  - esxi
  - connectivity
