  title: Migration Toolkit for Virtualization 2.11 troubleshooting migration
  url: https://docs.redhat.com/en/documentation/migration_toolkit_for_virtualization/2.11/html/migrating_your_virtual_machines_to_red_hat_openshift_virtualization/assembly_troubleshooting-migration_mtv
  text: '# Migration Toolkit for Virtualization 2.11 Troubleshooting Guide


    ## Section 1: Migration Controller Architecture and Failure Workflow

    Migration Toolkit for Virtualization orchestrates VM imports from VMware vSphere
    to Red Hat OpenShift Virtualization. The migration workflow executes in distinct
    phases: plan validation, PVC and DataVolume provisioning via CDI, disk transfer
    from source ESXi, changed block tracking synchronization during warm migrations,
    guest operating system conversion via virt-v2v, and VM creation in KubeVirt. When
    a migration fails, the agent must inspect current infrastructure evidence across
    VMware, MTV, CDI, and OpenShift before determining root cause or recommending
    safe recovery actions.


    ## Section 2: VMware Changed Block Tracking (CBT) and Snapshot Retry Limit

    Warm migration relies on VMware Changed Block Tracking (CBT) snapshots to replicate
    incremental disk changes while the source virtual machine continues running. If
    a CBT snapshot operation fails, MTV attempts incremental retries up to the configured
    retry limit.

    Common root causes for CBT failures include:

    1. Snapshot consolidation failure on VMware vCenter or ESXi datastore.

    2. Virtual machine hardware version incompatibility (hardware version must be
    7 or higher).

    3. CBT disabled or corrupted on the virtual machine vmx configuration (ctkEnabled=true).

    4. Stale snapshots or locked VMDK descriptors preventing new delta snapshot generation.

    When the warm migration retry limit is reached, MTV aborts the transfer with error
    code vmware.cbt.retry_limit and records a transfer failure.

    Investigation procedure: Confirm CBT state on VMware vCenter, verify disk snapshot
    chains, and inspect MTV controller transfer errors. To resolve CBT corruption,
    power off the VM or use VMware PowerCLI to reset ctkEnabled to false and then
    re-enable it. Verify ESXi host network connectivity before restarting the migration
    plan. Never execute automated remediation against production hypervisors without
    approval and snapshot verification.


    ## Section 3: Destination Network Attachment Definition (NAD) Missing

    During VM network interface migration, MTV maps VMware distributed virtual switches
    (DVS) and port groups to secondary networks on OpenShift Virtualization. These
    target networks require a NetworkAttachmentDefinition (NAD) resource configured
    with Multus CNI in the target namespace.

    Failure symptom: The migration plan halts in network configuration phase with
    error network.destination_nad_missing.

    Investigation procedure: Confirm whether the referenced NetworkAttachmentDefinition
    exists in the target namespace using oc get network-attachment-definition. Verify
    that the CNI plugin (e.g., bridge, ovn-k8s, or macvlan) is installed and functional
    on target worker nodes. Correct the network mapping in the MTV Migration Plan
    before re-running migration.


    ## Section 4: Target Storage Provisioning and CSI Timeouts

    Containerized Data Importer (CDI) creates a DataVolume that requests PersistentVolumeClaims
    (PVC) through the configured StorageClass. If the Container Storage Interface
    (CSI) provisioner times out while creating or attaching the target volume, the
    migration fails with storage.csi.provisioning_timeout.

    Investigation procedure: Verify the target PVC state (Pending, Bound, Lost). Inspect
    CSI controller pod logs for RPC timeouts. Check target storage backend health
    (Ceph, ODF, SAN) before concluding a storage outage. If the backend is healthy,
    check Kubernetes volumeAttachment objects and CSI provisioner leader election.


    ## Section 5: VMware ESXi Host and vCenter Connectivity

    MTV requires bidirectional network communication between OpenShift worker nodes
    and VMware infrastructure. Control plane operations communicate with vCenter over
    TCP port 443 (HTTPS), while disk transfer operations use VDDK to stream VMDK data
    directly from ESXi hosts over TCP port 902.

    Failure symptom: Transfer fails with vmware.esxi.port443_unreachable or connection
    refused.

    Investigation procedure: Verify firewall policies between OpenShift cluster nodes
    and VMware ESXi management IP addresses. Verify TLS certificate thumbprints and
    SSL verification settings in the MTV Provider secret.


    ## Section 6: Guest OS Conversion and virt-v2v Failures

    The virt-v2v conversion pod inspects the guest operating system, installs KubeVirt
    VirtIO drivers, and configures kernel boot parameters. On Windows guests, Volume
    Shadow Copy Service (VSS) quiescing failures can prevent consistent disk captures.
    Ensure VMware Tools are updated and clean guest file systems prior to warm migration
    cutover.

    '
