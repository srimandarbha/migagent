  title: VDDK data source export handshake failure and missing export definition
  url: https://access.redhat.com/solutions/7127535
  text: '# VDDK Data Source Export Handshake Failure


    ## Symptom and Failure Signature

    Migration fails during transfer with vmware.vddk.export_missing or vmware.vddk.handshake_error.
    CDI importer pod logs: "VDDK data source handshake reports that the server has
    no export" or "nbdkit: error: server has no export".


    ## Technical Root Cause Analysis

    During disk transfer, CDI runs an nbdkit sidecar with the VDDK plugin that exposes
    the source virtual machine disk as an NBD export.

    If the source VMDK is unmounted, moved, locked by another process, or the ESXi
    host experiences a datastore path drop, nbdkit fails to open the disk path and
    returns an empty export list to the nbdcopy process.


    ## Authoritative Diagnostic Procedure

    1. Inspect nbdkit logs in the CDI importer pod: oc logs -n <target-ns> <importer-pod>
    -c nbdkit.

    2. Check VMware vCenter to verify that the source VM has not migrated hosts or
    datastores (vMotion/Storage vMotion) during transfer.

    3. Verify that the VMDK path listed in the migration plan matches the current
    VM disk topology.


    ## Recommended Recovery Procedure

    1. Ensure DRS (Distributed Resource Scheduler) and Storage DRS are disabled or
    set to manual for virtual machines undergoing migration.

    2. Restart the migration plan after confirming disk files are intact on the source
    datastore.

    '
