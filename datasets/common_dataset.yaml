  title: Destination PVC block device smaller than source virtual disk
  url: https://access.redhat.com/solutions/7140030
  text: '# Destination Storage Volume Smaller Than Source Disk


    ## Symptom and Failure Signature

    Disk transfer fails immediately with disk.destination_smaller_than_source. Importer
    pod error reports: "nbdcopy: destination block device is smaller than source disk
    (source: 107374182400 bytes, destination: 107370000000 bytes)".


    ## Technical Root Cause Analysis

    When converting virtual disk sizes from VMware vSphere to Kubernetes PVC requests,
    size rounding or filesystem overhead differences between GiB and GB can cause
    the destination PVC to be slightly smaller than the raw byte length of the source
    VMDK.

    Because block-level copy tools (qemu-img, nbdcopy) require destination capacity
    to be greater than or equal to source byte count, copy aborts with an overflow
    error.


    ## Authoritative Diagnostic Procedure

    1. Inspect source VMDK capacity in bytes using vCenter API or govc vm.info.

    2. Inspect target PVC capacity in bytes: oc get pvc <pvc-name> -o jsonpath=''{.status.capacity.storage}''.

    3. Compare exact byte counts.


    ## Recommended Recovery Procedure

    1. Configure MTV storage profile or plan mapping with a 1 GiB capacity overhead
    buffer to account for partition table alignment and metadata.

    2. Resize the target PVC / DataVolume spec if storageclass supports expansion.

    '
  tags:
  - disk
  - capacity
  - vmdk
  - nbdcopy
  - pvc
  - sizing
