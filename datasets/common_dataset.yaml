  title: RHEL guest fstab Augeas parse failure due to malformed mount options
  url: https://access.redhat.com/solutions/7127017
  text: '# RHEL /etc/fstab Augeas Parse Failure During Guest Inspection


    ## Symptom and Failure Signature

    Migration fails during inspection with os.rhel.fstab_parse. Log reports: "libguestfs:
    error: aug_load: /files/etc/fstab: parse_failed: empty mount option field".


    ## Technical Root Cause Analysis

    virt-v2v uses the Augeas configuration parsing library to read and modify /etc/fstab
    (e.g., updating swap and root disk UUIDs).

    Augeas requires strictly valid /etc/fstab syntax.

    If /etc/fstab contains double spaces instead of single tabs, empty option fields
    (e.g., defaults,,noatime), or trailing whitespace before comments, the Augeas
    lens fails to parse the file, causing libguestfs inspection to abort.


    ## Authoritative Diagnostic Procedure

    1. Inspect /etc/fstab on the source Linux VM.

    2. Run augtool print /files/etc/fstab inside a test container to replicate the
    parser failure.


    ## Recommended Recovery Procedure

    1. Correct malformed lines in /etc/fstab on the source VM before migration. Ensure
    all entries follow the standard 6-column format: <spec> <file> <vfstype> <mntops>
    <freq> <passno>.

    2. Re-trigger the MTV migration plan.

    '
  tags:
  - conversion
  - rhel
  - fstab
  - augeas
  - libguestfs
  - syntax
