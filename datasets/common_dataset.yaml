  product: migration-toolkit-for-virtualization
  product_version: '2.11'
  failure_codes:
  - conversion.virt_v2v.oom
  - conversion.oom_killed
  title: virt-v2v conversion pod Out of Memory OOM killer termination
  url: https://access.redhat.com/solutions/7135435
  text: '# virt-v2v Conversion Pod Terminated by Out of Memory (OOM) Killer


    ## Symptom and Failure Signature

    Migration fails during guest conversion phase with conversion.virt_v2v.oom. The
    virt-v2v conversion pod is terminated with exit code 137 (OOMKilled).


    ## Technical Root Cause Analysis

    virt-v2v uses libguestfs to inspect the guest OS, mount filesystems, install VirtIO
    drivers, and rebuild initramfs images.

    For virtual machines with very large file systems, millions of inodes, complex
    LVM/Btrfs configurations, or Windows registry hives, libguestfs memory footprint
    can exceed the default pod memory limit (typically 4 GiB).

    The Linux kernel cgroup OOM killer terminates the conversion pod to protect the
    worker node.


    ## Authoritative Diagnostic Procedure

    1. Inspect the conversion pod termination reason: oc get pod -n <target-ns> -l
    app=virt-v2v -o jsonpath=''{.items[0].status.containerStatuses[0].state.terminated.reason}''.

    2. Confirm ExitCode 137.

    3. Inspect dmesg or node audit.log for oom_killer events.


    ## Recommended Recovery Procedure

    1. Increase the virt-v2v memory limit in the ForkliftController CR or ConfigMap:
    set virt_v2v_memory_limit to 8Gi or 16Gi.

    2. Restart the migration plan.

    '
  tags:
  - conversion
  - virt-v2v
  - oom
  - memory
  - libguestfs
