  title: Troubleshooting VMware Changed Block Tracking CBT snapshot retry limit during
    warm migration
  url: https://docs.redhat.com/en/documentation/migration_toolkit_for_virtualization/2.11/html/migrating_your_virtual_machines_to_red_hat_openshift_virtualization/troubleshooting_cbt_retry_limit
  text: '# VMware Changed Block Tracking (CBT) Snapshot Retry Limit Exceeded


    ## Symptom and Failure Signature

    During warm migration of a VMware virtual machine to Red Hat OpenShift Virtualization,
    the MTV Migration Plan halts during the precopy phase with failure code vmware.cbt.retry_limit.
    The controller log reports: "Warm import retry limit reached; CBT snapshot limit
    prevents another precopy snapshot".


    ## Technical Root Cause Analysis

    Warm migration replicates changed disk sectors incrementally using VMware vSphere
    Changed Block Tracking (CBT). Each precopy iteration requests a temporary VM snapshot
    to query ChangedDiskAreas via VDDK.

    The failure occurs due to one of the following root causes:

    1. Virtual machine snapshot consolidation failure on the ESXi host or vCenter
    datastore.

    2. High I/O rate inside the guest operating system causing delta disk generation
    to exceed transfer bandwidth.

    3. CBT configuration state corruption inside the virtual machine configuration
    file (.vmx), specifically ctkEnabled=true losing tracking state.

    4. Stale or orphaned snapshot disks (*-00000X.vmdk) in the datastore locking VMDK
    descriptors.


    ## Authoritative Diagnostic Procedure

    1. Query VMware vCenter VirtualMachine snapshot status and consolidation status
    (VirtualMachine.runtime.consolidationNeeded).

    2. Verify whether ctkEnabled is true in VM extraConfig and each virtual disk has
    scsiX:Y.ctkEnabled=true.

    3. Inspect OpenShift MTV migration controller pod logs for consecutive precopy
    failures.

    4. Inspect ESXi hostd.log and vmware.log for snapshot creation lock timeouts.


    ## Recommended Recovery Procedure

    1. If snapshot consolidation is required, perform manual snapshot consolidation
    in VMware vCenter.

    2. If CBT is corrupted, power off the VM during scheduled maintenance and reset
    CBT by toggling ctkEnabled to false and back to true.

    3. Alternatively, convert the migration plan to a cold migration if downtime is
    acceptable.

    '
  tags:
  - mtv
  - vmware
  - cbt
  - snapshot
  - precopy
  - warm-migration
  - retry-limit
