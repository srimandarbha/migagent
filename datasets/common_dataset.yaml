  title: VDDK container image required for VMware warm migrations in MTV
  url: https://access.redhat.com/solutions/7083221
  text: '# VDDK Image Configuration Required for VMware Migrations


    ## Symptom and Failure Signature

    Plan validation rejects a migration plan with failure code vmware.vddk.required.
    The controller condition states: "VDDK image is required for VMware warm migrations
    and must be configured in forklift-controller settings".


    ## Technical Root Cause Analysis

    Due to VMware licensing terms, Red Hat cannot distribute the VMware Virtual Disk
    Development Kit (VDDK).

    MTV requires customers to build an OCI container image containing VDDK and reference
    it in the ForkliftController custom resource.

    Warm migration strictly requires VDDK because Changed Block Tracking queries and
    delta block replication depend on the vixDiskLib library. Without VDDK configured,
    warm migration cannot proceed.


    ## Authoritative Diagnostic Procedure

    1. Inspect the ForkliftController resource: oc get forkliftcontroller -n openshift-mtv
    -o yaml.

    2. Check if spec.vddk_image is empty or points to an invalid image pull path.

    3. Verify image pull secrets in openshift-mtv if the VDDK image is in a private
    registry.


    ## Recommended Recovery Procedure

    1. Download the VMware VDDK archive from the VMware developer portal matching
    your ESXi version (e.g., VDDK 8.0).

    2. Build and push the VDDK wrapper container image to an enterprise registry accessible
    by OpenShift worker nodes.

    3. Set spec.vddk_image in the ForkliftController CR.

    '
