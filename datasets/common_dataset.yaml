  - storage.volume_binding_mode
  title: StorageClass WaitForFirstConsumer volume binding stall during AllocateDisks
  url: https://access.redhat.com/solutions/7062526
  text: '# StorageClass WaitForFirstConsumer Binding Stall During AllocateDisks


    ## Symptom and Failure Signature

    Migration plan stalls indefinitely in AllocateDisks phase with storage.storageclass.wait_for_first_consumer.
    PVCs remain Pending with event "waiting for first consumer to be created before
    binding".


    ## Technical Root Cause Analysis

    Kubernetes StorageClasses support two volumeBindingModes: Immediate and WaitForFirstConsumer.

    When a StorageClass uses WaitForFirstConsumer, Kubernetes does not invoke the
    CSI provisioner until a pod consuming the PVC is scheduled onto a node.

    In MTV workflows, if CDI does not immediately launch the dummy importer or transfer
    pod, or if scheduling constraints (nodeSelector, taints) prevent the consumer
    pod from scheduling, the PVC cannot bind, deadlocking disk allocation.


    ## Authoritative Diagnostic Procedure

    1. Inspect target StorageClass: oc get storageclass <sc-name> -o jsonpath=''{.volumeBindingMode}''.

    2. Inspect target PVCs and DataVolumes: oc get dv,pvc -n <target-ns>.

    3. Check for Pending CDI importer pods and inspect scheduling events (oc describe
    pod <importer-pod>).


    ## Recommended Recovery Procedure

    1. If local storage is used, ensure target worker nodes have capacity and match
    pod tolerations.

    2. For shared block/file storage (ODF Ceph-RBD, SAN), consider using Immediate
    volume binding mode or ensure CDI transfer pods are permitted to schedule immediately.

    '
  tags:
  - storage
  - storageclass
  - wait-for-first-consumer
  - cdi
  - datavolume
