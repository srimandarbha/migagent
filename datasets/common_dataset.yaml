  title: Windows Volume Shadow Copy Service VSS unavailable during warm migration
    snapshot
  url: https://docs.redhat.com/en/documentation/migration_toolkit_for_virtualization/2.11/html/migrating_your_virtual_machines_to_red_hat_openshift_virtualization/troubleshooting_windows_vss
  text: '# Windows Volume Shadow Copy Service (VSS) Unavailable During Warm Migration


    ## Symptom and Failure Signature

    Warm migration of a Windows VM fails during precopy snapshot creation with os.windows.vss_unavailable
    or os.windows.snapshot_quiesce_failed. VMware vCenter reports: "An error occurred
    while quiescing the virtual machine. A problem occurred while saving the snapshot
    to the database".


    ## Technical Root Cause Analysis

    When MTV warm migration creates a precopy snapshot on a running Windows VM, VMware
    Tools invokes the Windows Volume Shadow Copy Service (VSS) to flush disk caches
    and quiesce SQL Server/Exchange/file transactions.

    If the Windows VSS service (VSS) or VMware Snapshot Provider service is disabled,
    or if third-party VSS writers are in a failed/timed-out state, quiesced snapshot
    creation fails.


    ## Authoritative Diagnostic Procedure

    1. In Windows PowerShell on the source VM, run: vssadmin list writers to identify
    writers in a Failed state.

    2. Check Windows Event Viewer Application and System logs for VSS Event IDs 8193,
    12293, or 12298.

    3. Verify the status of "Volume Shadow Copy" and "VMware Snapshot Provider" services.


    ## Recommended Recovery Procedure

    1. Restart the Volume Shadow Copy service and any failed VSS writer services (e.g.,
    Cryptographic Services, System Writer).

    2. If quiescing continues to fail, update VMware Tools to the latest supported
    release.

    3. For non-transactional workloads, cold migration can be selected to bypass live
    snapshot quiescing.

    '
  tags:
  - windows
  - vss
  - snapshot
  - quiesce
  - vmware-tools
  - warm-migration
