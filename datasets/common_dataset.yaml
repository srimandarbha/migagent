  - vmware.vcenter.policy_denied
  - vmware.vcenter.insufficient_privileges
  title: VMware vCenter role-based access policy denied and insufficient privileges
  url: https://access.redhat.com/solutions/7098325
  text: '# VMware vCenter Access Policy Denied or Insufficient Privileges


    ## Symptom and Failure Signature

    MTV Provider validation or migration step fails with vmware.vcenter.policy_denied
    or vmware.vcenter.insufficient_privileges. Controller log reports: "Permission
    to perform this operation was denied: User does not hold privilege ''VirtualMachine.Provisioning.DiskRandomAccess''".


    ## Technical Root Cause Analysis

    The vSphere user account provided in the MTV Secret lacks the required VMware
    vCenter role permissions needed to inspect VMs, take snapshots, and stream disk
    blocks via VDDK.

    Required privileges include:

    - Datastore: Allocate space, Browse datastore, Low level file operations.

    - Virtual Machine -> Provisioning: Allow disk access, Allow read-only disk access,
    Allow virtual machine download.

    - Virtual Machine -> State: Create snapshot, Remove snapshot.

    - Cryptographer: Access (if encrypted VMs or vSAN encryption is active).


    ## Authoritative Diagnostic Procedure

    1. Inspect vCenter Events log for PermissionDenied events for the MTV service
    user.

    2. Verify the role assigned to the MTV service account in vCenter Global Permissions.

    3. Check whether privileges are assigned at the root vCenter level or restricted
    to specific datacenters/clusters.


    ## Recommended Recovery Procedure

    1. Create a dedicated MTV role in vCenter with the documented Red Hat MTV minimum
    privileges.

    2. Grant this role to the MTV service account at the vCenter root level with inheritance
    enabled.

    '
