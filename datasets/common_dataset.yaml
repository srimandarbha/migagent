  title: Destination NetworkAttachmentDefinition NAD missing in target namespace
  url: https://docs.redhat.com/en/documentation/migration_toolkit_for_virtualization/2.11/html/migrating_your_virtual_machines_to_red_hat_openshift_virtualization/troubleshooting_destination_nad
  text: '# Destination NetworkAttachmentDefinition (NAD) Missing


    ## Symptom and Failure Signature

    Migration plan validation or execution halts with network.destination_nad_missing.
    Controller error states: "Destination network not found: NetworkAttachmentDefinition
    ''vlan100-nad'' does not exist in target namespace".


    ## Technical Root Cause Analysis

    OpenShift Virtualization uses Multus CNI to connect virtual machines to secondary
    networks (VLANs, Flat networks, external bridges).

    MTV NetworkMaps associate VMware source port groups or distributed virtual switches
    with target secondary networks represented by a NetworkAttachmentDefinition CR.

    If the referenced NetworkAttachmentDefinition was not created in the target VM
    namespace or was deleted, MTV cannot configure the target VM interface.


    ## Authoritative Diagnostic Procedure

    1. Check existing NADs in target namespace: oc get network-attachment-definition
    -n <target-namespace>.

    2. Inspect the MTV NetworkMap resource: oc get networkmap -n openshift-mtv -o
    yaml.

    3. Verify whether the NAD exists in default or other namespaces instead of the
    target VM namespace.


    ## Recommended Recovery Procedure

    1. Create the required NetworkAttachmentDefinition in the target namespace with
    the appropriate CNI plugin configuration (bridge, ovn-k8s, or macvlan).

    2. Alternatively, update the MTV NetworkMap to point to an existing valid secondary
    network or the default pod network.

    '
  tags:
  - network
  - nad
  - multus
  - networkmap
  - vlan
  - secondary-network
