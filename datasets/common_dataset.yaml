  title: MTV vddk-validator pod permission denied reading VDDK container image
  url: https://access.redhat.com/solutions/7130264
  text: '# VDDK Image Permission Denied in MTV vddk-validator


    ## Symptom and Failure Signature

    MTV Provider configuration fails during VDDK image verification with error vmware.vddk.permission_denied.
    The vddk-validator pod in openshift-mtv fails with: "cannot read/copy files from
    the VDDK image: Permission denied" or SELinux permission error.


    ## Technical Root Cause Analysis

    MTV requires a custom VDDK image built by the customer containing VMware proprietary
    VDDK libraries.

    If the VDDK container image files were created with restrictive file permissions
    (e.g., chmod 0700 owned by root) or without world-read permissions, the non-root
    user in the vddk-validator init container and CDI importer pods cannot extract
    libvixDiskLib.so.


    ## Authoritative Diagnostic Procedure

    1. Inspect logs of the vddk-validator pod: oc logs -n openshift-mtv -l app=vddk-validator.

    2. Inspect the file permissions inside the VDDK image by running podman run --rm
    <vddk-image> ls -la /opt/vmware-vix-disklib-distrib.

    3. Check node audit.log for SELinux denials related to container_t.


    ## Recommended Recovery Procedure

    1. Rebuild the VDDK container image with explicit world-readable permissions:
    chmod -R 755 /opt/vmware-vix-disklib-distrib inside the Dockerfile.

    2. Push the updated image to the container registry and update the MTV Settings
    CR.

    '
