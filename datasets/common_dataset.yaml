  - conversion.arg_list_too_long
  title: Image conversion pod argument list too long E2BIG error
  url: https://access.redhat.com/solutions/7147407
  text: '# Image Conversion Pod Fails with Argument List Too Long (E2BIG)


    ## Symptom and Failure Signature

    Image conversion pod fails immediately upon startup with conversion.image_conversion.argument_list_too_long.
    Pod logs show: "fork/exec /usr/bin/virt-v2v: argument list too long" or errno
    7 (E2BIG).


    ## Technical Root Cause Analysis

    When migrating complex VMs with numerous virtual disks (e.g., database VMs with
    16 to 32 disks) and extensive disk mapping arguments, the generated CLI command
    line for virt-v2v exceeds the Linux kernel execve() argument buffer limit (MAX_ARG_STRLEN
    / ARG_MAX, typically 2 MiB).


    ## Authoritative Diagnostic Procedure

    1. Count the number of attached disks on the source VM.

    2. Inspect the conversion pod specification in openshift-mtv for an excessively
    long container command/args array.


    ## Recommended Recovery Procedure

    1. In MTV 2.11+, configure the migration plan to use an argument response file
    or volume mapping file.

    2. For multi-disk VMs, consider splitting non-root data disks into separate storage
    volumes attached after initial OS migration.

    '
  tags:
  - conversion
  - virt-v2v
  - e2big
  - arguments
  - multi-disk
