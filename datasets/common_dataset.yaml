  title: Linux bridge NetworkAttachmentDefinition VLAN tagging mismatch
  url: https://access.redhat.com/solutions/7150106
  text: '# Linux Bridge VLAN Tagging Mismatch on Migrated Virtual Machines


    ## Symptom and Failure Signature

    Virtual machine migration completes successfully, but the guest virtual machine
    has no network connectivity post-cutover. Event reports network.bridge_vlan_mismatch
    or ARP resolution failure.


    ## Technical Root Cause Analysis

    In VMware vSphere, port groups can operate in Virtual Switch Tagging (VST) mode
    where the hypervisor strips the VLAN tag before presenting frames to the VM vNIC.

    If the OpenShift NetworkAttachmentDefinition is configured as a trunk without
    VLAN filtering, or conversely if double VLAN tagging occurs because both switch
    and NAD apply tags, traffic is dropped by the physical switch.


    ## Authoritative Diagnostic Procedure

    1. Inspect source port group VLAN ID in vCenter.

    2. Check the NetworkAttachmentDefinition spec for vlan tag settings.

    3. Run tcpdump on the worker node bridge interface to check for 802.1Q tagged
    frames.


    ## Recommended Recovery Procedure

    1. Configure the NetworkAttachmentDefinition with the exact VLAN tag required
    if the physical uplink is a trunk.

    2. Ensure NodeNetworkConfigurationPolicy (NNCP) has VLAN filtering enabled on
    the Linux bridge.

    '
