  title: Windows guest Inaccessible Boot Device BSOD due to missing VirtIO drivers
  url: https://access.redhat.com/solutions/7150107
  text: '# Windows Guest Inaccessible Boot Device (BSOD) Missing VirtIO Drivers


    ## Symptom and Failure Signature

    Migrated Windows virtual machine starts on OpenShift Virtualization but crashes
    immediately with Blue Screen of Death (BSOD) bugcheck INACCESSIBLE_BOOT_DEVICE
    (0x0000007B). Failure code: os.windows.virtio_drivers_missing.


    ## Technical Root Cause Analysis

    OpenShift Virtualization virtual machines use KubeVirt with VirtIO-SCSI storage
    controllers and VirtIO-Net network adapters.

    If virt-v2v conversion was unable to inject Red Hat VirtIO Windows drivers into
    the Windows DriverStore (e.g., because the virtio-win container image was missing
    in MTV or driver injection was bypassed), the Windows bootloader cannot initialize
    the disk controller.


    ## Authoritative Diagnostic Procedure

    1. Inspect KubeVirt VM boot screen in the OpenShift web console VNC viewer for
    BSOD 0x7B.

    2. Check MTV ForkliftController configuration for the virtio_win_image setting.

    3. Inspect virt-v2v conversion pod log for "Installing VirtIO drivers into Windows
    guest".


    ## Recommended Recovery Procedure

    1. Ensure the virtio-win container image is correctly specified in the MTV ForkliftController
    CR.

    2. Alternatively, attach the virtio-win ISO to the KubeVirt VM and boot into Windows
    Recovery Environment (WinRE) to run dism /image:C:\ /add-driver /driver:E:\viostor.

    '
  tags:
  - windows
  - virtio
  - bsod
  - storage
  - drivers
  - inaccessible-boot-device
