  title: Container Storage Interface CSI provisioning timeout on OpenShift target
    storage
  url: https://access.redhat.com/solutions/7147445
  text: '# Container Storage Interface (CSI) Provisioning Timeout


    ## Symptom and Failure Signature

    Target PVC remains in Pending state during CopyDisks or AllocateDisks phase, and
    migration fails with storage.csi.provisioning_timeout. Event log displays: "ProvisioningFailed:
    failed to provision volume with StorageClass: rpc error: code = DeadlineExceeded".


    ## Technical Root Cause Analysis

    MTV uses Containerized Data Importer (CDI) DataVolumes to allocate target PersistentVolumeClaims
    (PVCs) for each migrated disk.

    A CSI provisioning timeout occurs when:

    1. The underlying storage cluster (OpenShift Data Foundation Ceph, NetApp Trident,
    Dell CSM, Pure Storage) is degraded or experiencing I/O backlog.

    2. The CSI controller pod lost its lease or leader election during volume provisioning.

    3. Storage pool capacity is exhausted on the physical storage array.


    ## Authoritative Diagnostic Procedure

    1. Inspect target PVC status: oc describe pvc <pvc-name> -n <target-namespace>.

    2. Check events in target namespace for CSI provisioner warnings.

    3. Check storage cluster health (e.g., oc get cephcluster -n openshift-storage
    or array management interface).

    4. Inspect CSI provisioner controller pod logs for RPC timeouts.


    ## Recommended Recovery Procedure

    1. Verify physical storage array health and resolve backend saturation or pool
    exhaustion.

    2. Restart the CSI controller provisioner pod if leader election or RPC deadlocks
    occur.

    3. Re-run migration once the storage backend reports healthy status.

    '
