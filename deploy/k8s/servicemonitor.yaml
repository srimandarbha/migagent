apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: migration-failure-agent-monitor
  namespace: migration-system
  labels:
    app.kubernetes.io/name: migration-failure-agent
    app.kubernetes.io/part-of: mfa
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: migration-failure-agent
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
