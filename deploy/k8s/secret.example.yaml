apiVersion: v1
kind: Secret
metadata:
  name: migration-failure-agent-secrets
  namespace: migration-system
  labels:
    app.kubernetes.io/name: migration-failure-agent
    app.kubernetes.io/part-of: mfa
type: Opaque
stringData:
  DATABASE_URL: "postgresql://mfa_user:REPLACE_WITH_SECURE_PASSWORD@mfa-postgresql.migration-system.svc:5432/migration_agent"
  GROQ_API_KEY: "REPLACE_WITH_GROQ_API_KEY"
  # Optional Kafka TLS / SASL authentication parameters:
  # KAFKA_SECURITY_PROTOCOL: "SASL_SSL"
  # KAFKA_SASL_MECHANISM: "SCRAM-SHA-512"
  # KAFKA_SASL_USERNAME: "mfa-service"
  # KAFKA_SASL_PASSWORD: "REPLACE_WITH_SASL_PASSWORD"
