apiVersion: apps/v1
kind: Deployment
metadata:
  name: migration-failure-agent
  namespace: migration-system
  labels:
    app.kubernetes.io/name: migration-failure-agent
    app.kubernetes.io/part-of: mfa
    app.kubernetes.io/version: "2.12.3"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: migration-failure-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migration-failure-agent
        app.kubernetes.io/part-of: mfa
        app.kubernetes.io/version: "2.12.3"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: migration-failure-agent-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: image-registry.openshift-image-registry.svc:5000/migration-system/migration-failure-agent:2.12.3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: migration-failure-agent-config
            - secretRef:
                name: migration-failure-agent-secrets
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: tmp-dir
          emptyDir: {}
