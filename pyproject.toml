[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "migration-failure-agent"
version = "2.12.3"
description = "Production-oriented VMware to OpenShift Virtualization migration failure decision engine"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2",
  "PyYAML>=6",
  "psycopg[binary]>=3.2",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "confluent-kafka>=2.8",
  "packaging>=23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "persistence*", "simulator*", "evaluation*", "harness*"]

[tool.pytest.ini_options]
markers = [
  "integration: requires external PostgreSQL/Kafka/integration services",
]

pythonpath = ["."]
testpaths = ["tests"]
